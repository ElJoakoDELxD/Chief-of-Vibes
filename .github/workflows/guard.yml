# Rejects pull requests into main that touch files outside the template.
# Agent memory and project output belong on agent branches, never on main.
#
# Self-protection limit: a pull request can edit this workflow itself, and the
# edited copy is what runs on that pull request. This guard is a tripwire, not
# a lock — the lock is branch protection on main plus the Principal's review.
name: guard
on:
  pull_request:
    branches: [main]
jobs:
  template-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject non-template paths
        run: |
          allow='^((SYSTEM|CLAUDE|README|CONTRIBUTING)\.md|LICENSE|repomix\.config\.json|\.gitignore|\.canon)$|^(\.claude|\.github|tools)/'
          fail=0
          while IFS= read -r -d '' f; do
            if ! printf '%s' "$f" | grep -qE "$allow"; then
              echo "REJECT: $f is outside the template"
              fail=1
            fi
          done < <(git diff -z --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          exit $fail
      - name: Require a version bump
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          version() {
            git show "$1:SYSTEM.md" 2>/dev/null \
              | sed -n 's/^\*\*Version \([0-9][0-9.]*\)\.\*\*.*/\1/p' | head -n1
          }
          base="$(version "$BASE")"
          head="$(version "$HEAD")"
          if [ -z "$head" ]; then
            echo "REJECT: SYSTEM.md carries no '**Version X.Y.Z.**' line"
            exit 1
          fi
          if [ "$base" = "$head" ]; then
            echo "REJECT: every merge into main is a release — bump SYSTEM.md's version (still $head)"
            exit 1
          fi
          echo "Version $base → $head"
