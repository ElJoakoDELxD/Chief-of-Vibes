# The four checks SYSTEM.md §1 promises on a pull request, as four jobs.
#
# They were five steps inside one job, which broke the promise twice. The table
# in §1 lists four checks and a reader saw one. And steps are fail-fast, so the
# first rejection hid every check after it: an author fixed one thing, pushed,
# and met the next. Jobs run in parallel and report all four at once.
#
# Self-protection limit: a pull request can edit this workflow itself, and the
# edited copy is what runs on that pull request. These are tripwires, not a lock
# — the lock is branch protection on main plus the Principal's review.
name: guard
on:
  pull_request:
    # Every pull request, whatever its base. A branch-name list was here until
    # 1.79.0 and it named the prefix this repository had stopped using, so a
    # stacked layer got no checks at all and the top of the stack lands every
    # layer under it. Nothing compares such a list against the branches in use,
    # so nothing could catch it. Measured 08-09-2026, on the stack that shipped
    # 1.75.0 to 1.78.0: two of four layers opened with zero checks.
    #
    # A copy naming its branches differently inherits the same defect from a
    # list, which is why there is none. What is excluded is decided by reading
    # the branch instead: see the scope step in every job below.
    types: [opened, synchronize, reopened, edited]
jobs:
  pr-guard:
    # Rejects non-template files bound for main, and a template change with no
    # version bump. The logic is tools/pr-guard.sh, benched by
    # tools/test-pr-guard.sh — logic that lives only in a workflow is logic
    # whose failure mode is a green check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: bash .github/scope.sh
      - name: Only template files, and a release carries a version
        if: steps.scope.outputs.skip != 'true'
        run: |
          bash tools/pr-guard.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.repository }}"

  index-check:
    # The index is generated, never maintained (§1). A hand-written list is a
    # second copy that starts to drift the day after it is written, so the check
    # regenerates it and compares.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: scope
        run: bash .github/scope.sh
      - name: Require a current INDEX.md
        if: steps.scope.outputs.skip != 'true'
        run: bash tools/index.sh --check

  section-check:
    # SYSTEM.md is the core and system/ holds the leaves, so most of the
    # specification is read on demand. That is safe only while every pointer is
    # true: a row sending an agent to a file that does not hold that section
    # says a rule exists where it does not (§8).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: scope
        run: bash .github/scope.sh
      - name: Require the specification's map to match its tree
        if: steps.scope.outputs.skip != 'true'
        run: bash tools/sections.sh --check

  prose-gate:
    # §7 keeps 1.5 violations per 100 words as the reference rate, and says the
    # number is a reading rather than a verdict. This reports and never blocks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: scope
        run: bash .github/scope.sh
      - name: Report the prose score
        if: steps.scope.outputs.skip != 'true'
        run: bash tools/prose-gate.sh
