name: merge-stack

on:
  push:
    branches: ['claude/merge-stack-27']

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Repoint each layer at its rebased head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for pair in "claude/stack-enablement-check:claude/rebased-25" \
                      "claude/queue-needs-evidence:claude/rebased-26" \
                      "claude/stacks-from-a-session:claude/rebased-28"; do
            target=${pair%%:*}
            source=${pair##*:}
            sha=$(gh api "repos/$REPO/git/ref/heads/$source" --jq '.object.sha')
            gh api --method PATCH "repos/$REPO/git/refs/heads/$target" -f sha="$sha" -F force=true --jq '.object.sha'
          done

      - name: Merge the stack with a merge commit, not a squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sleep 15
          printf '%s' '{"merge_method":"merge","merge_action":"default"}' > body.json
          out=$(gh api --method PUT "repos/$REPO/pulls/28/merge-async" --input body.json)
          printf '%s\n' "$out"
          status=$(printf '%s' "$out" | jq -r '.status')
          uuid=$(printf '%s' "$out" | jq -r '.details.uuid // empty')
          n=0
          while [ "$status" = "pending" ] && [ -n "$uuid" ] && [ "$n" -lt 40 ]; do
            sleep 10
            n=$((n+1))
            out=$(gh api "repos/$REPO/pulls/28/merge-async/$uuid")
            status=$(printf '%s' "$out" | jq -r '.status')
            printf '%s %s\n' "$n" "$status"
          done
          printf '%s\n' "$out"
          [ "$status" = "merged" ] || [ "$status" = "enqueued" ]

      - name: Read back the final state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +o pipefail
          sleep 20
          for n in 24 25 26 28; do
            gh api "repos/$REPO/pulls/$n" --jq '{pr: .number, state: .state, merged: .merged, base: .base.ref}'
          done
          gh api "repos/$REPO/contents/SYSTEM.md" --jq '.content' | base64 -d | grep -m1 -o 'Version [0-9.]*'
