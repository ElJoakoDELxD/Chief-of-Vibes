# Deletes the branches `main` already contains, for a session that cannot.
#
# A cloud session's git credentials live outside its sandbox, and the proxy
# that signs on the session's behalf refuses a ref deletion whatever branch is
# checked out. Push and branch creation work in the same session, so what is
# refused is the destructive ref update and not the credential. No setting
# changes it: the environment option for unrestricted pushes chooses which
# branch, not which operation.
#
# A runner is a different origin: same repository, its own token, no proxy in
# between. Same shape as .github/workflows/stacks.yml and create-release.yml,
# and the third time this repository has needed it.
#
# The logic is tools/sweep-branches.sh, benched by tools/test-sweep-branches.sh
# against a real bare repository. Logic that lives only in a workflow is logic
# whose failure mode is a green check.
#
# Reports by default. Deleting takes a deliberate input, because a sweep nobody
# read is a sweep nobody agreed to.
name: sweep-branches

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Report what would go, or delete it
        required: true
        type: choice
        options: [report, delete]
        default: report

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      # Full history and every remote head: the sweep decides by asking whether
      # main contains each tip, and a shallow clone cannot answer that.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sweep
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if [[ "${{ inputs.mode }}" == delete ]]; then
            bash tools/sweep-branches.sh origin --delete
          else
            bash tools/sweep-branches.sh origin
          fi
