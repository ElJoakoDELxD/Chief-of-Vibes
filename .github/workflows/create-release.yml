# Publishes a GitHub release for a session that cannot: the default token in
# a session's own environment has no route to a write endpoint the Claude
# Code auto-mode classifier will let it call directly, and no MCP tool exists
# for creating or editing a release either (checked, twice, before this was
# built).
#
# A runner is a different origin: same repository, its own token, no
# classifier in front of it. Dispatch this workflow and read the result in
# the job log. Same shape as .github/workflows/stacks.yml.
#
# **Every public word comes out of a file in this repository.** The notes file
# carries the title as its first heading and the body as everything under it,
# so both are reviewed in a diff and scored by the prose gate before they can
# ship. A title passed as a dispatch input escaped both, and on the first live
# run it shipped in the wrong language (§6 keeps the canon in English). An
# input is not a review.
#
# The tag is never taken on trust either. It is read from SYSTEM.md's own
# version line at run time and the input must match, so a release cannot ship
# a tag that outran the specification the day it was cut.
name: create-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.46.0. Must equal SYSTEM.md's version line at run time."
        required: true
        type: string
      notes_path:
        description: "Path to a Markdown file in this repository. Its first `# ` line is the title; the rest is the body."
        required: true
        type: string
      mode:
        description: Create a new release, or correct the one already published under this tag
        required: true
        type: choice
        options: [create, update]
        default: create

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the tag to match SYSTEM.md's version
        run: |
          version="$(sed -n 's/^\*\*Version \([0-9][0-9.]*\)\.\*\*.*/\1/p' SYSTEM.md | head -n1)"
          want="v${version}"
          if [[ "${{ inputs.tag }}" != "${want}" ]]; then
            echo "Tag '${{ inputs.tag }}' does not match SYSTEM.md's version (${want})." >&2
            echo "Read the version at the moment of release, never before." >&2
            exit 1
          fi

      - name: Read the title and body out of the notes file
        env:
          NOTES: ${{ inputs.notes_path }}
        run: |
          if [[ ! -f "${NOTES}" ]]; then
            echo "No file at '${NOTES}'." >&2
            exit 1
          fi
          title="$(sed -n 's/^# //p' "${NOTES}" | head -n1)"
          if [[ -z "${title}" ]]; then
            echo "'${NOTES}' has no '# ' heading, so it carries no title." >&2
            echo "The title lives in the file so it is reviewed like the body." >&2
            exit 1
          fi
          printf '%s\n' "${title}" > /tmp/title.txt
          sed '0,/^# /d' "${NOTES}" | sed '/./,$!d' > /tmp/body.md
          echo "Title: ${title}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(cat /tmp/title.txt)"
          if [[ "${{ inputs.mode }}" == update ]]; then
            gh release edit "${{ inputs.tag }}" --title "${title}" --notes-file /tmp/body.md
          else
            gh release create "${{ inputs.tag }}" \
              --title "${title}" --notes-file /tmp/body.md --target main
          fi
